[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-agent"
version = "0.1.0"
description = "LiveKit voice agent: Faster-Whisper STT -> Ollama LLM (tools) -> n8n webhooks -> Kokoro TTS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "livekit-agents>=1.0.0",
    "livekit-api>=1.0.0",
    "livekit>=0.18",
    "faster-whisper>=1.0.0",
    "numpy>=1.26",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
agent-run = "voice_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]
